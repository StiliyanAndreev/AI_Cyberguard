version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cyberguard_db
    environment:
      POSTGRES_DB: cyberguard
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: cyberguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  cyberguard-web:
    build: .
    container_name: cyberguard_app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: cyberguard
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: cyberguard
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata: